<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PinkMeUP is a beauty spa and academy booking platform for appointments, salon services, and customer access.">
    <meta name="application-name" content="PinkMeUP">
    <title>PinkMeUP | Beauty Spa & Academy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container" style="text-align: center; max-width: 700px;">
        <h1>PinkMeUP</h1>
        <p style="color: #666; margin-bottom: 12px;">Beauty Spa &amp; Academy</p>
        <p style="color: #666; margin-bottom: 24px; line-height: 1.6;">
            PinkMeUP helps clients book beauty and wellness services, manage appointments, and connect with salon professionals in one simple platform.
        </p>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="login.html" class="btn" style="text-decoration: none; display: block;">Sign In</a>
            <a href="register.html" class="btn btn-secondary" style="text-decoration: none; display: block;">Create Account</a>
            <button id="quick-book-btn" class="btn btn-secondary" type="button">Quick Book</button>
        </div>

        <p style="margin-top: 20px; font-size: 0.95rem; color: #666;">
            <a href="privacy.html" style="color: #D43F6B; text-decoration: none;">Privacy Policy</a>
        </p>
    </div>
    <script>
        const quickBookBtn = document.getElementById('quick-book-btn');
        if (quickBookBtn) {
            quickBookBtn.addEventListener('click', () => {
                const guestUser = {
                    id: 'guest-' + Date.now(),
                    firstName: 'Guest',
                    lastName: 'User',
                    email: 'guest@pinkmeup.local',
                    phone: '',
                    role: 'customer'
                };

                localStorage.setItem('user', JSON.stringify(guestUser));
                window.location.href = 'customerdashboard.html';
            });
        }
    </script>
</body>
</html>
