<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkMeUP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container" style="text-align: center;">
        <h1>PinkMeUP</h1>
        <p style="color: #666; margin-bottom: 30px;">Beauty Spa &amp; Academy</p>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="login.html" class="btn" style="text-decoration: none; display: block;">Sign In</a>
            <a href="register.html" class="btn btn-secondary" style="text-decoration: none; display: block;">Create Account</a>
            <button id="quick-book-btn" class="btn btn-secondary" type="button">Quick Book</button>
        </div>
    </div>
    <script>
        const quickBookBtn = document.getElementById('quick-book-btn');
        if (quickBookBtn) {
            quickBookBtn.addEventListener('click', () => {
                window.location.href = 'customerdashboard.html';
            });
        }
    </script>
</body>
</html>
