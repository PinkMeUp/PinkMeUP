<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PinkMeUP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>PinkMeUP</h1>
        <h2>Dashboard</h2>

        <div style="text-align: center; padding: 30px; background: #f9f9f9; border-radius: 4px; margin: 20px 0;">
            <p style="font-size: 18px; font-weight: bold; color: #28a745;">Login Successful</p>
            <p style="color: #888; margin-top: 8px;">Your dashboard will be here soon.</p>
        </div>

        <div style="display: flex; justify-content: center; gap: 12px; margin-top: 16px;">
            <button class="btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
