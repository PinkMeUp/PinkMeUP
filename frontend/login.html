<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PinkMeUP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>PinkMeUP</h1>
        <h2>Welcome Back</h2>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <span id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; font-size: 14px; user-select: none;">Show</span>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <label style="font-size: 14px; color: #666; cursor: pointer;">
                    <input type="checkbox" id="remember"> Remember Me
                </label>
                <a href="reset.html" style="color: #ff6b9d; font-size: 14px; text-decoration: none;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn" id="login-btn">Sign In</button>
        </form>

        <!-- Google Sign-In -->
        <div style="text-align: center; margin-top: 20px;">
            <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
            <p style="color: #888; font-size: 14px; margin-bottom: 12px;">or</p>
            <a href="https://pinkmeup-api.onrender.com/api/v1/auth/google" class="btn btn-google">
                Sign in with Google
            </a>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
