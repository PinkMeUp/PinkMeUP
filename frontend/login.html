<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#2A0818">

    <title>Sign In - PinkMeUP</title>

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- PinkMeUP Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: 'Inter', Arial, sans-serif;

            background-color: #ffffff;

            /* Soft plum/pink radial glows — echoes the hero on the landing page */
            background-image:
                radial-gradient(circle at 12% 15%, rgba(212, 63, 107, 0.055), transparent 42%),
                radial-gradient(circle at 88% 85%, rgba(255, 182, 193, 0.10), transparent 46%);
            background-attachment: fixed;

            color: #1a1a1a;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 25px;

            -webkit-font-smoothing: antialiased;
        }

        /* =====================================================
           ACCESSIBILITY
           ===================================================== */

        :focus-visible {
            outline: 2px solid #FF7A9C;
            outline-offset: 3px;
            border-radius: 4px;
        }

        button:focus:not(:focus-visible),
        a:focus:not(:focus-visible),
        input:focus:not(:focus-visible) {
            outline: none;
        }

        /* =====================================================
           AUTH AREA
           ===================================================== */

        .auth-container {
            width: 100%;
            max-width: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px 0;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .auth-container h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;

            font-size: 3.2rem;
            font-weight: 600;

            letter-spacing: 1px;
            line-height: 1;

            text-align: center;

            background: linear-gradient(
                135deg,
                #FFD0D9 0%,
                #FF7A9C 45%,
                #D43F6B 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            filter: drop-shadow(0 4px 18px rgba(212, 63, 107, 0.18));

            margin-bottom: 10px;
        }

        .auth-container h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;

            font-size: 2rem;
            font-weight: 600;

            color: #1a1a1a;

            text-align: center;

            letter-spacing: -0.2px;

            margin-bottom: 32px;
        }

        /* =====================================================
           MESSAGES
           ===================================================== */

        .error,
        .success {
            width: 100%;

            font-size: 0.85rem;
            font-weight: 500;

            padding: 12px 16px;

            border-radius: 10px;

            margin-bottom: 18px;

            display: none;

            line-height: 1.5;
        }

        .error {
            color: #a01a35;
            background: rgba(212, 63, 107, 0.08);
            border: 1px solid rgba(212, 63, 107, 0.22);
        }

        .success {
            color: #1e7a3e;
            background: rgba(40, 167, 69, 0.08);
            border: 1px solid rgba(40, 167, 69, 0.22);
        }

        .error.show,
        .success.show {
            display: block;
        }

        /* =====================================================
           FORM
           ===================================================== */

        #login-form {
            width: 100%;
        }

        .form-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.8rem;
            font-weight: 600;

            letter-spacing: 0.4px;

            color: #1a1a1a;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            padding: 14px 16px;

            background: #ffffff;

            border: 1px solid rgba(212, 63, 107, 0.28);
            border-radius: 10px;

            font-family: 'Inter', Arial, sans-serif;
            font-size: 0.92rem;

            color: #1a1a1a;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .form-group input::placeholder {
            color: #a8a8a8;
        }

        .form-group input:hover {
            border-color: rgba(212, 63, 107, 0.45);
        }

        .form-group input:focus {
            outline: none;

            border-color: #D43F6B;

            box-shadow: 0 0 0 3px rgba(212, 63, 107, 0.12);
        }

        /* =====================================================
           PASSWORD
           ===================================================== */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        #toggle-password {
            position: absolute;

            right: 16px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #D43F6B;

            font-size: 0.75rem;
            font-weight: 600;

            letter-spacing: 0.6px;
            text-transform: uppercase;

            user-select: none;

            transition: color 0.2s ease;
        }

        #toggle-password:hover {
            color: #1a1a1a;
        }

        /* =====================================================
           REMEMBER ME / FORGOT PASSWORD
           ===================================================== */

        .login-options {
            width: 100%;

            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 22px;

            gap: 12px;
            flex-wrap: wrap;
        }

        .remember-label {
            display: flex !important;

            align-items: center;

            gap: 8px;

            margin-bottom: 0 !important;

            color: #4a4a4a !important;

            font-size: 0.82rem !important;

            font-weight: 400 !important;

            cursor: pointer;

            transition: color 0.2s ease;
        }

        .remember-label:hover {
            color: #1a1a1a !important;
        }

        #remember {
            width: 15px;
            height: 15px;

            accent-color: #D43F6B;

            cursor: pointer;

            flex-shrink: 0;
        }

        .forgot-password {
            color: #D43F6B;

            font-size: 0.82rem;
            font-weight: 500;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #1a1a1a;

            text-decoration: underline;
        }

        /* =====================================================
           SIGN IN BUTTON — gradient pill, matches landing page CTA
           ===================================================== */

        #login-btn {
            width: 100%;

            padding: 15px 24px;

            background: linear-gradient(135deg, #FFB6C1 0%, #D43F6B 100%);
            color: #ffffff;

            border: none;
            border-radius: 50px;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.88rem;
            font-weight: 600;

            letter-spacing: 0.6px;
            text-transform: uppercase;

            cursor: pointer;

            box-shadow: 0 6px 20px rgba(212, 63, 107, 0.30);

            transition:
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s ease,
                opacity 0.25s ease;
        }

        #login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 63, 107, 0.45);
        }

        #login-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 4px 14px rgba(212, 63, 107, 0.32);
        }

        #login-btn:disabled {
            background: #eeeeee;
            color: #999999;

            box-shadow: none;

            cursor: not-allowed;

            transform: none;
        }

        /* =====================================================
           GOOGLE SECTION
           ===================================================== */

        .google-section {
            width: 100%;

            margin-top: 28px;
        }

        .google-divider {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            margin-bottom: 20px;
        }

        .google-divider::before {
            content: "";

            position: absolute;

            left: 0;
            right: 0;

            height: 1px;

            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(212, 63, 107, 0.30) 20%,
                rgba(212, 63, 107, 0.30) 80%,
                transparent 100%
            );
        }

        .google-divider span {
            position: relative;
            z-index: 1;

            background-color: #ffffff;

            padding: 0 16px;

            color: #7a7a7a;

            font-size: 0.78rem;
            font-weight: 500;

            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        /* =====================================================
           GOOGLE BUTTON — dark plum pill
           ===================================================== */

        .btn-google {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 14px 24px;

            background: #1a1a1a;
            color: #FFD0D9;

            border: 1.5px solid #1a1a1a;
            border-radius: 50px;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.88rem;
            font-weight: 600;

            letter-spacing: 0.3px;

            text-align: center;
            text-decoration: none;

            transition:
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .btn-google:hover {
            background: #2A0818;
            color: #FFB6C1;
            border-color: #2A0818;

            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(26, 5, 16, 0.22);
        }

        .btn-google:active {
            transform: translateY(0);
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .auth-footer {
            width: 100%;

            text-align: center;

            margin-top: 26px;

            color: #7a7a7a;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.82rem;

            line-height: 1.5;
        }

        .auth-footer a {
            color: #D43F6B;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #1a1a1a;

            text-decoration: underline;
        }

        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 30px 20px;
            }

            .auth-container {
                max-width: 100%;
            }

            .auth-container h1 {
                font-size: 2.7rem;
            }

            .auth-container h2 {
                font-size: 1.8rem;

                margin-bottom: 28px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-group input {
                padding: 14px 16px;

                font-size: 16px;
            }

            .password-wrapper input {
                padding-right: 68px;
            }

            #login-btn,
            .btn-google {
                padding: 15px 22px;
            }
        }

        /* =====================================================
           SMALL PHONE
           ===================================================== */

        @media (max-width: 400px) {

            body {
                padding: 25px 18px;
            }

            .auth-container h1 {
                font-size: 2.4rem;
            }

            .auth-container h2 {
                font-size: 1.6rem;
                margin-bottom: 24px;
            }

            .form-group label {
                font-size: 0.78rem;
            }

            .login-options {
                gap: 8px;
            }

            .auth-footer {
                font-size: 0.78rem;
            }
        }

        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h1>PinkMeUP</h1>

        <h2>Welcome Back</h2>

        <div id="error" class="error" role="alert" aria-live="polite"></div>

        <div id="success" class="success" role="status" aria-live="polite"></div>

        <form id="login-form" novalidate>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <span id="toggle-password" role="button" tabindex="0" aria-label="Show password">
                        Show
                    </span>

                </div>

            </div>

            <div class="login-options">

                <label
                    for="remember"
                    class="remember-label"
                >
                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember Me
                </label>

                <a
                    href="reset.html"
                    class="forgot-password"
                >
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                id="login-btn"
            >
                Sign In
            </button>

        </form>

        <!-- Google Sign-In -->

        <div class="google-section">

            <div class="google-divider" aria-hidden="true">
                <span>or</span>
            </div>

            <a
                id="google-auth"
                href="#"
                class="btn-google"
            >
                Sign in with Google
            </a>

        </div>

        <div class="auth-footer">
            Don't have an account?
            <a href="register.html">Create one</a>
        </div>

    </div>

    <script src="js/runtime-config.js"></script>
<script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
