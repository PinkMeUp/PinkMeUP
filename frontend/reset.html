<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - PinkMeUP</title>

    <!-- PinkMeUP Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: 'Inter', Arial, sans-serif;

            background: #ffffff;
            color: #000000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 25px;
        }

        /* =====================================================
           AUTH AREA
           ===================================================== */

        .auth-container {
            width: 100%;
            max-width: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px 0;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .auth-container h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;

            font-size: 3.2rem;
            font-weight: 600;

            letter-spacing: 1px;
            line-height: 1;

            text-align: center;

            background: linear-gradient(
                135deg,
                #FFB6C1 0%,
                #D43F6B 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            margin-bottom: 8px;
        }

        .auth-container h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;

            font-size: 2rem;
            font-weight: 600;

            color: #000000;

            text-align: center;

            margin-bottom: 20px;
        }

        /* =====================================================
           DESCRIPTION
           ===================================================== */

        .reset-description {
            width: 100%;

            text-align: center;

            color: #666666;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.85rem;

            line-height: 1.5;

            margin-bottom: 24px;
        }

        /* =====================================================
           MESSAGES
           ===================================================== */

        .error,
        .success {
            width: 100%;

            font-size: 0.85rem;

            margin-bottom: 15px;

            display: none;
        }

        .error {
            color: #dc3545;
        }

        .success {
            color: #28a745;
        }

        .error.show,
        .success.show {
            display: block;
        }

        /* =====================================================
           FORM
           ===================================================== */

        #reset-form {
            width: 100%;
        }

        .form-group {
            width: 100%;

            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.85rem;
            font-weight: 500;

            color: #000000;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            background: #ffffff;

            border: 1px solid #cfcfcf;
            border-radius: 0;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.9rem;

            color: #000000;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        .form-group input:focus {
            outline: none;

            border-color: #D43F6B;

            box-shadow: 0 0 0 2px rgba(212, 63, 107, 0.08);
        }

        /* =====================================================
           RESET BUTTON
           ===================================================== */

        #reset-btn {
            width: 100%;

            padding: 13px 20px;

            background: #ffffff;

            color: #000000;

            border: 1.5px solid #D43F6B;
            border-radius: 0;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.9rem;
            font-weight: 600;

            letter-spacing: 0.3px;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        #reset-btn:hover {
            background: #D43F6B;

            color: #ffffff;
        }

        #reset-btn:disabled {
            background: #eeeeee;

            color: #999999;

            border-color: #cccccc;

            cursor: not-allowed;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .auth-footer {
            width: 100%;

            text-align: center;

            margin-top: 24px;

            color: #666666;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.8rem;
        }

        .auth-footer a {
            color: #D43F6B;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #000000;

            text-decoration: underline;
        }

        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 30px 20px;
            }

            .auth-container {
                max-width: 100%;
            }

            .auth-container h1 {
                font-size: 2.7rem;
            }

            .auth-container h2 {
                font-size: 1.8rem;

                margin-bottom: 18px;
            }

            .reset-description {
                font-size: 0.8rem;

                margin-bottom: 22px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-group input {
                padding: 14px;

                font-size: 16px;
            }

            #reset-btn {
                padding: 14px 18px;
            }
        }

        /* =====================================================
           SMALL PHONE
           ===================================================== */

        @media (max-width: 400px) {

            body {
                padding: 25px 18px;
            }

            .auth-container h1 {
                font-size: 2.4rem;
            }

            .auth-container h2 {
                font-size: 1.6rem;
            }

            .form-group label {
                font-size: 0.8rem;
            }

            .auth-footer {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h1>PinkMeUP</h1>

        <h2>Reset Password</h2>

        <p class="reset-description">
            Enter your email and we'll send you a reset link.
        </p>

        <div id="error" class="error"></div>

        <div id="success" class="success"></div>

        <form id="reset-form">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <button
                type="submit"
                id="reset-btn"
            >
                Send Reset Link
            </button>

        </form>

        <div class="auth-footer">

            Remember your password?

            <a href="login.html">
                Sign In
            </a>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reset.js"></script>

</body>
</html>
