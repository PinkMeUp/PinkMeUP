<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#2A0818">

    <title>Reset Password - PinkMeUP</title>

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- PinkMeUP Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: 'Inter', Arial, sans-serif;

            background-color: #ffffff;

            /* Soft plum/pink radial glows — echoes the hero on the landing page */
            background-image:
                radial-gradient(circle at 12% 15%, rgba(212, 63, 107, 0.055), transparent 42%),
                radial-gradient(circle at 88% 85%, rgba(255, 182, 193, 0.10), transparent 46%);
            background-attachment: fixed;

            color: #1a1a1a;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 25px;

            -webkit-font-smoothing: antialiased;
        }

        /* =====================================================
           ACCESSIBILITY
           ===================================================== */

        :focus-visible {
            outline: 2px solid #FF7A9C;
            outline-offset: 3px;
            border-radius: 4px;
        }

        button:focus:not(:focus-visible),
        a:focus:not(:focus-visible),
        input:focus:not(:focus-visible) {
            outline: none;
        }

        /* =====================================================
           AUTH AREA
           ===================================================== */

        .auth-container {
            width: 100%;
            max-width: 430px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px 0;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .auth-container h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;

            font-size: 3.2rem;
            font-weight: 600;

            letter-spacing: 1px;
            line-height: 1;

            text-align: center;

            background: linear-gradient(
                135deg,
                #FFD0D9 0%,
                #FF7A9C 45%,
                #D43F6B 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            filter: drop-shadow(0 4px 18px rgba(212, 63, 107, 0.18));

            margin-bottom: 10px;
        }

        .auth-container h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;

            font-size: 2rem;
            font-weight: 600;

            color: #1a1a1a;

            text-align: center;

            letter-spacing: -0.2px;

            margin-bottom: 20px;
        }

        /* =====================================================
           DESCRIPTION
           ===================================================== */

        .reset-description {
            width: 100%;

            text-align: center;

            color: #7a7a7a;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.88rem;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* =====================================================
           MESSAGES
           ===================================================== */

        .error,
        .success {
            width: 100%;

            font-size: 0.85rem;
            font-weight: 500;

            padding: 12px 16px;

            border-radius: 10px;

            margin-bottom: 18px;

            display: none;

            line-height: 1.5;
        }

        .error {
            color: #a01a35;
            background: rgba(212, 63, 107, 0.08);
            border: 1px solid rgba(212, 63, 107, 0.22);
        }

        .success {
            color: #1e7a3e;
            background: rgba(40, 167, 69, 0.08);
            border: 1px solid rgba(40, 167, 69, 0.22);
        }

        .error.show,
        .success.show {
            display: block;
        }

        /* =====================================================
           FORM
           ===================================================== */

        #reset-form {
            width: 100%;
        }

        .form-group {
            width: 100%;

            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.8rem;
            font-weight: 600;

            letter-spacing: 0.4px;

            color: #1a1a1a;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            padding: 14px 16px;

            background: #ffffff;

            border: 1px solid rgba(212, 63, 107, 0.28);
            border-radius: 10px;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.92rem;

            color: #1a1a1a;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .form-group input::placeholder {
            color: #a8a8a8;
        }

        .form-group input:hover {
            border-color: rgba(212, 63, 107, 0.45);
        }

        .form-group input:focus {
            outline: none;

            border-color: #D43F6B;

            box-shadow: 0 0 0 3px rgba(212, 63, 107, 0.12);
        }

        /* =====================================================
           RESET BUTTON — gradient pill, matches landing page CTA
           ===================================================== */

        #reset-btn {
            width: 100%;

            padding: 15px 24px;

            background: linear-gradient(135deg, #FFB6C1 0%, #D43F6B 100%);
            color: #ffffff;

            border: none;
            border-radius: 50px;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.88rem;
            font-weight: 600;

            letter-spacing: 0.6px;
            text-transform: uppercase;

            cursor: pointer;

            box-shadow: 0 6px 20px rgba(212, 63, 107, 0.30);

            transition:
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s ease,
                opacity 0.25s ease;
        }

        #reset-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 63, 107, 0.45);
        }

        #reset-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 4px 14px rgba(212, 63, 107, 0.32);
        }

        #reset-btn:disabled {
            background: #eeeeee;

            color: #999999;

            box-shadow: none;

            cursor: not-allowed;

            transform: none;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .auth-footer {
            width: 100%;

            text-align: center;

            margin-top: 26px;

            color: #7a7a7a;

            font-family: 'Inter', Arial, sans-serif;

            font-size: 0.82rem;

            line-height: 1.5;
        }

        .auth-footer a {
            color: #D43F6B;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #1a1a1a;

            text-decoration: underline;
        }

        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 30px 20px;
            }

            .auth-container {
                max-width: 100%;
            }

            .auth-container h1 {
                font-size: 2.7rem;
            }

            .auth-container h2 {
                font-size: 1.8rem;

                margin-bottom: 18px;
            }

            .reset-description {
                font-size: 0.82rem;

                margin-bottom: 24px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .form-group input {
                padding: 14px 16px;

                font-size: 16px;
            }

            #reset-btn {
                padding: 15px 22px;
            }
        }

        /* =====================================================
           SMALL PHONE
           ===================================================== */

        @media (max-width: 400px) {

            body {
                padding: 25px 18px;
            }

            .auth-container h1 {
                font-size: 2.4rem;
            }

            .auth-container h2 {
                font-size: 1.6rem;
                margin-bottom: 16px;
            }

            .form-group label {
                font-size: 0.78rem;
            }

            .reset-description {
                font-size: 0.78rem;
            }

            .auth-footer {
                font-size: 0.78rem;
            }
        }

        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h1>PinkMeUP</h1>

        <h2>Reset Password</h2>

        <p class="reset-description">
            Enter your email and we'll send you a reset link.
        </p>

        <div id="error" class="error" role="alert" aria-live="polite"></div>

        <div id="success" class="success" role="status" aria-live="polite"></div>

        <form id="reset-form">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                id="reset-btn"
            >
                Send Reset Link
            </button>

        </form>

        <div class="auth-footer">

            Remember your password?

            <a href="login.html">
                Sign In
            </a>

        </div>

    </div>

    <script src="js/runtime-config.js"></script>
<script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reset.js"></script>

</body>
</html>
